<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expuco - Inscripcion a Eventos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="logo-uco.png" class="logo" alt="Logo Universidad">
        <h1>Plataforma de Inscripcion a Eventos</h1>
    </header>

    <main>
        <div id="banner" class="banner oculto"></div>

        <h2>Eventos disponibles</h2>
        <div id="listaEventos"></div>
    </main>

    <!-- ===== MODAL DE INSCRIPCION (formulario de dos pasos) ===== -->
    <div id="modal" class="modal oculto">
        <div class="modal-contenido">
            <button id="btnCerrarModal" class="cerrar-modal" type="button">&times;</button>
            <h2 id="modalTitulo">Inscripcion</h2>

            <!-- PASO 1: rol + documento -->
            <div id="paso1">
                <p class="paso-indicador">Paso 1 de 2</p>

                <label>Selecciona tu rol:</label>
                <div class="opciones-rol">
                    <button type="button" class="opcion-rol" data-rol="Estudiante">Estudiante</button>
                    <button type="button" class="opcion-rol" data-rol="Docente">Docente</button>
                </div>

                <label for="inputDocumento">Numero de documento:</label>
                <input type="text" id="inputDocumento" inputmode="numeric" maxlength="10" placeholder="Solo numeros">

                <div id="msgPaso1" class="msg oculto"></div>
                <button id="btnContinuar" type="button">Continuar</button>
            </div>

            <!-- PASO 2: datos personales -->
            <div id="paso2" class="oculto">
                <p class="paso-indicador">Paso 2 de 2</p>

                <label for="inputNombres">Nombres:</label>
                <input type="text" id="inputNombres">

                <label for="inputApellidos">Apellidos:</label>
                <input type="text" id="inputApellidos">

                <label for="inputFechaNacimiento">Fecha de nacimiento:</label>
                <input type="date" id="inputFechaNacimiento">

                <label for="inputCorreo">Correo electronico:</label>
                <input type="email" id="inputCorreo" placeholder="ejemplo@correo.com">

                <div id="msgPaso2" class="msg oculto"></div>
                <button id="btnConfirmar" type="button">Confirmar inscripcion</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
