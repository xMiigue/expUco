<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expuco - Inscripcion a Eventos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Plataforma de Inscripcion a Eventos</h1>
    </header>

    <main>
        <!-- Paso 1: elegir quien se inscribe -->
        <section class="seleccion">
            <label for="selectUsuario">Usuario:</label>
            <select id="selectUsuario"></select>
        </section>

        <!-- Banner con el resultado de la ultima inscripcion -->
        <div id="banner" class="banner oculto"></div>

        <!-- Paso 2: lista de eventos -->
        <section>
            <h2>Eventos disponibles</h2>
            <div id="listaEventos"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
