spring.application.name=expuco

# Base de datos H2 EN MEMORIA (se borra al apagar la app). DB_CLOSE_DELAY=-1 la mantiene viva mientras corre la app.
spring.datasource.url=jdbc:h2:mem:expuco;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ejecutar siempre schema.sql (crea tablas) y data.sql (datos de demo) al arrancar.
spring.sql.init.mode=always

# Consola web de H2 para ver los datos durante la demo: http://localhost:8080/h2-console
spring.h2.console.enabled=true
