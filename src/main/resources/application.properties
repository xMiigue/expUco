spring.application.name=expuco

# Base de datos SQL Server (contenedor Docker sqlserver-expuco en el puerto 1435).
spring.datasource.url=jdbc:sqlserver://localhost:1435;databaseName=ExpUco;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=ExpUco2026!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Ejecutar siempre schema.sql (crea tablas) y data.sql (datos de demo) al arrancar,
# para que las fechas relativas a hoy se recalculen y la demo funcione cualquier dia.
spring.sql.init.mode=always
